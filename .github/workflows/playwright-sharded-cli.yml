name: Playwright Sharded + Notion CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shards:
    name: Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Prepare blob report directory
        run: mkdir -p blob-report

      - name: Run shard tests (blob reporter)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-and-send-notion:
    name: Merge Reports + Send Notion
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    needs: test-shards
    if: ${{ always() }}
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Prepare merged input directory
        run: mkdir -p all-blob-reports

      - name: Download all shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Check blob report files
        id: blob_reports
        shell: bash
        run: |
          shopt -s nullglob
          files=(all-blob-reports/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "No shard blob report files found. Skipping merge and Notion upload."
          else
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge reports into JSON
        if: steps.blob_reports.outputs.has_reports == 'true'
        run: mkdir -p all-blob-reports && npx playwright merge-reports --reporter json ./all-blob-reports > merged-report.json

      - name: Send merged report to Notion
        if: steps.blob_reports.outputs.has_reports == 'true'
        run: node dist/cli.js ./notion-reporter-cli.config.ci.ts ./merged-report.json
