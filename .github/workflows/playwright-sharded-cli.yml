name: Playwright Sharded + Notion CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-shards:
    name: Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run shard tests (blob reporter)
        run: npx playwright test --reporter blob --shard=${{ matrix.shard }}/4

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  merge-and-send-notion:
    name: Merge Reports + Send Notion
    runs-on: ubuntu-latest
    needs: test-shards
    if: ${{ always() }}
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports into JSON
        run: npx playwright merge-reports --reporter json ./all-blob-reports > merged-report.json

      - name: Build package
        run: npm run build

      - name: Send merged report to Notion
        run: node dist/cli.js ./notion-reporter-cli.config.ci.ts ./merged-report.json
