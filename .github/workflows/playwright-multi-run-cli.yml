name: Playwright Multi-Run + Notion CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-run-and-send-notion:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Prepare blob report directories
        run: mkdir -p blob-report/run-1 blob-report/run-2 merged-blob-reports

      - name: Run command 1 (demo.spec.ts, blob output)
        run: PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report/run-1 npx playwright test example/tests/demo.spec.ts || true

      - name: Run command 2 (demo2.spec.ts, blob output)
        run: PLAYWRIGHT_BLOB_OUTPUT_DIR=blob-report/run-2 npx playwright test example/tests/demo2.spec.ts || true

      - name: Collect blob reports for merge
        shell: bash
        run: |
          run1BlobDir="blob-report/run-1"
          run2BlobDir="blob-report/run-2"
          mergedBlobDir="merged-blob-reports"
          shopt -s nullglob

          for zipFile in "${run1BlobDir}"/*.zip; do
            cp "${zipFile}" "${mergedBlobDir}/run-1-$(basename "${zipFile}")"
          done
          for zipFile in "${run2BlobDir}"/*.zip; do
            cp "${zipFile}" "${mergedBlobDir}/run-2-$(basename "${zipFile}")"
          done

      - name: Check blob report files
        id: blob_reports
        shell: bash
        run: |
          shopt -s nullglob
          files=(merged-blob-reports/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "No blob report files found. Skipping merge and Notion upload."
          else
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge reports into JSON
        if: steps.blob_reports.outputs.has_reports == 'true'
        run: npx playwright merge-reports --reporter json ./merged-blob-reports > merged-report.json

      - name: Send merged report to Notion
        if: steps.blob_reports.outputs.has_reports == 'true'
        run: node dist/cli.js ./notion-reporter-cli.config.ci.ts ./merged-report.json
